name: "01 — Security Scan"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov on Bicep files
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: bicep,arm
          output_format: sarif
          output_file_path: checkov-bicep.sarif
          soft_fail: false
          # CKV_AZURE_87 misfires on every Microsoft.Security/pricings resource,
          # not just KeyVaults (false positive).
          skip_check: CKV_AZURE_1,CKV_AZURE_2,CKV_AZURE_87
          # Pre-existing findings are tracked in the baseline; new ones fail.
          baseline: .checkov.baseline

      - name: Run Checkov on Terraform files
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-terraform.sarif
          soft_fail: false
          baseline: terraform/.checkov.baseline

      - name: Upload Checkov Bicep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('checkov-bicep.sarif') != ''
        with:
          sarif_file: checkov-bicep.sarif
          category: checkov-bicep

      - name: Upload Checkov Terraform SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('checkov-terraform.sarif') != ''
        with:
          sarif_file: checkov-terraform.sarif
          category: checkov-terraform

  # tfsec is deprecated upstream (and tfsec-action has no sarif_file input,
  # so no SARIF was ever written); its checks now ship in `trivy config`.
  trivy-config:
    name: Trivy IaC Misconfiguration Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  psscriptanalyzer:
    name: PSScriptAnalyzer — PowerShell Security Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -Settings PSGallery
          if ($results) {
            $results | Format-Table -AutoSize
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) {
              Write-Error "PSScriptAnalyzer found $($errors.Count) error(s). Build failed."
              exit 1
            }
          } else {
            Write-Host "PSScriptAnalyzer: No issues found."
          }

  yaml-lint:
    name: YAML Lint — GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/
          config_data: |
            extends: default
            rules:
              document-start: disable
              line-length:
                max: 250
              truthy:
                allowed-values: ['true', 'false']
                check-keys: false
